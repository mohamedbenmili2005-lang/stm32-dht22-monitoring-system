<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Surveillance Température & Humidité</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f6f8;
            padding: 20px;
        }
        table {
            border-collapse: collapse;
            width: 50%;
            background: white;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: center;
        }
        th {
            background: #007acc;
            color: white;
        }
        h2{
            margin-left: 200px;
        }
    </style>
</head>
<body>

<h2>Système de surveillance</h2>

<table>
    <thead>
        <tr>
            <th>Température (°C)</th>
            <th>Humidité (%)</th>
            <th>Dates</th>
          
            
        </tr>
    </thead>
    <tbody id="dataTable">
    </tbody>
</table>

<script>
    fetch("/dzata")
        .then(response => response.json())
        .then(data => {
            const table = document.getElementById("dataTable");
            table.innerHTML = "";

            data.forEach(d => {
                const row = `
                    <tr>
                        <td>${d.temp}</td>
                        <td>${d.hum}</td>
                        <td>${d.dates}</td>
                    </tr>
                `;
                table.innerHTML += row;
            });
        });
</script>

</body>
</html>
